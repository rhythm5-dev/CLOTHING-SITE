{% extends "base.html" %}
{% block title %}Checkout — IRAE{% endblock %}
{% block content %}

<div style="max-width: 500px; margin: 40px auto; padding: 20px;">
  <h2>Shipping Details</h2>
  
  <!-- Cart Summary -->
  <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 25px;">
    {% for item in details %}
    <div style="display: flex; justify-content: space-between; padding: 5px 0;">
      <span>{{ item.product.name }} × {{ item.qty }}</span>
      <span>₹{{ item.line_total }}</span>
    </div>
    {% endfor %}
    <hr>
    <div style="display: flex; justify-content: space-between; font-weight: bold;">
      <span>Total</span>
      <span>₹{{ grand_total }}</span>
    </div>
  </div>
  
  <form method="POST">
    <div style="display: grid; gap: 12px;">
      <input type="text" name="name" placeholder="Full Name" required 
             style="padding: 12px; border: 1px solid #ddd; border-radius: 5px;">
      <input type="email" name="email" placeholder="Email" required 
             style="padding: 12px; border: 1px solid #ddd; border-radius: 5px;">
      <input type="tel" name="phone" placeholder="Phone Number" required 
             style="padding: 12px; border: 1px solid #ddd; border-radius: 5px;">
      <textarea name="address" placeholder="Full Address" required 
                style="padding: 12px; border: 1px solid #ddd; border-radius: 5px;"></textarea>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <input type="text" name="city" placeholder="City" required 
               style="padding: 12px; border: 1px solid #ddd; border-radius: 5px;">
        <input type="text" name="pincode" placeholder="PIN Code" required 
               style="padding: 12px; border: 1px solid #ddd; border-radius: 5px;">
      </div>
      <button type="submit" style="background: #000; color: white; padding: 15px; 
               border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 10px;">
        Continue to Payment →
      </button>
    </div>
  </form>
</div>

{% endblock %}
